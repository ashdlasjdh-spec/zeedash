# Force a Vercel PRODUCTION deploy on every push to main — so deploys are never previews.
#
# One-time setup: add these three repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — a Vercel access token (Vercel → Account → Settings → Tokens)
#   VERCEL_ORG_ID      — from `vercel link` (.vercel/project.json) or Vercel project settings
#   VERCEL_PROJECT_ID  — same source, per project
# Until VERCEL_TOKEN is present the job is a green no-op (it won't fail the commit).
#
# NOTE: if this project also has Vercel's native Git integration enabled, set its
# Production Branch to main OR disable auto-deploys to avoid deploying twice.
name: Production Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: cfg
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets to enable production deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.cfg.outputs.ready == 'true'
        run: npm i -g vercel@latest
      - if: steps.cfg.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - if: steps.cfg.outputs.ready == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - if: steps.cfg.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
