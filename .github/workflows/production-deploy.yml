# Vercel's existing Git integration deploys main. Verify its exact production result.
name: Production Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: production-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test application and release verification
        run: |
          npm test
          node --test scripts/verify-production.test.mjs
      - name: Build complete application
        env:
          REQUIRE_DOCS: '1'
        run: npm run build
      - name: Verify exact commit on production domain
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DOMAIN: zhd.lol
        run: node scripts/verify-production.mjs
