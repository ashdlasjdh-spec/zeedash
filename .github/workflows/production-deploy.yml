# Production deploys fail closed: tests, production build, and domain assignment must succeed.
name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://zhd.lol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test application and deployment checks
        run: |
          npm test
          node --test scripts/verify-production.test.mjs
      - name: Install pinned deployment CLI
        run: npm install --global vercel@59.17.0
      - name: Build and deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPECTED_DOMAIN: zhd.lol
          REQUIRE_DOCS: '1'
        shell: bash
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required production secret: $key"
              exit 1
            fi
          done
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          node --input-type=module -e "import { accessSync } from 'node:fs'; accessSync('public/docs/index.html')"
          deployment_url="$(vercel deploy --prebuilt --prod --yes --meta releaseCommit="$GITHUB_SHA" --token="$VERCEL_TOKEN")"
          vercel inspect "$deployment_url" --wait --timeout=5m --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL="$deployment_url" node scripts/verify-production.mjs
