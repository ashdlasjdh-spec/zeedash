name: CI

# Build + smoke tests on every push and PR, so a broken import, a bad page, or a
# failing test is caught here instead of on the next Vercel production deploy.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
