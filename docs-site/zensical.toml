[project]
# Served under /docs on the dashboard domain (see next.config.mjs rewrites). The trailing
# /docs/ is required so the generated directory-URL links resolve correctly under the subpath.
site_url = "https://zhd.lol/docs/"
site_name = "Zee Hood Docs"
site_description = "How the Zee Hood control panel works — game grants, moderation, and Discord server management."
site_author = "Zee Hood"

copyright = "Copyright &copy; 2026 Zee Hood"

# repo_url = "https://github.com/your-org/zeehood"
# repo_name = "your-org/zeehood"
# edit_uri = "edit/main/docs-site/docs/"

nav = [
  { "Start here" = [ { "Overview" = "index.md" }, { "Access & roles" = "access.md" } ] },
  { "Game portal" = [ { "Game control" = "game-control.md" }, { "Item catalog" = "catalog.md" }, { "Crew tags" = "crew-tags.md" }, { "Emojis" = "emojis.md" } ] },
  { "Moderation & group" = [ { "Moderation" = "moderation.md" }, { "Roblox group" = "group.md" } ] },
  { "Server portal" = [ { "Server management" = "server-management.md" }, { "Settings" = "server-settings.md" }, { "Security" = "security.md" }, { "Automation" = "automation.md" }, { "Utility" = "utility.md" }, { "Levels & XP" = "levels.md" }, { "Server tools" = "server-tools.md" }, { "Tickets" = "tickets.md" }, { "Economy & Fun" = "economy.md" } ] },
  { "Admin & control" = [ { "Config & keys" = "config.md" }, { "Game Site editor" = "game-site.md" }, { "Staff Sync" = "staff-sync.md" }, { "Role Access" = "role-access.md" } ] },
  { "Reference" = [ { "How it works" = "architecture.md" }, { "Every page" = "pages.md" } ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/book-open"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
